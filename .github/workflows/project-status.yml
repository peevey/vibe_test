name: Project status
on:
  issues:
    types: [labeled, unlabeled]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Browser tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
      status:
        description: Explicitly authorized status
        required: true
        type: choice
        options: [Ready, In Progress]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
concurrency:
  group: project-status
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'issues' || startsWith(github.event.label.name, 'workflow:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check activation and configuration
        id: config
        uses: actions/github-script@v7
        env:
          PROJECT_STATUS_ENABLED: ${{ vars.PROJECT_STATUS_ENABLED }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          script: |
            const { prepareProjectConfig } = require('./.github/scripts/project-config.cjs');
            const config = prepareProjectConfig({
              enabled: process.env.PROJECT_STATUS_ENABLED,
              projectNumber: process.env.PROJECT_NUMBER,
              hasToken: Boolean(process.env.PROJECTS_TOKEN) });
            core.setOutput('active', String(config.active));
            if (!config.active) {
              await core.summary.addHeading('Nicht aktiviert')
                .addRaw('Die Board-Automatisierung ist deaktiviert. Kein Board-Status wurde geändert. Bitte den Status manuell pflegen.\n\n')
                .addLink('Setup-Anleitung', `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/README.md#einmaliges-setup`)
                .write();
            }
      - name: Update linked issue status
        if: steps.config.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const { setProjectStatus, processEvent } = require('./.github/scripts/project-status.cjs');
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            if (!Number.isSafeInteger(projectNumber) || projectNumber <= 0) throw new Error('Invalid PROJECT_NUMBER');
            await processEvent({ github, context,
              update: (contentId, status) => setProjectStatus({ github,
                owner: context.repo.owner, projectNumber, contentId, status }) });
