name: Pages and PR previews
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Browser tests]
    branches: [main]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always load the trusted main branch, never the PR head.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Assemble main page and open PR previews
        uses: actions/github-script@v7
        with:
          script: |
            const build = require('./.github/scripts/build-pages.cjs');
            const previews = await build({ github, ...context.repo, output: '_site' });
            await core.summary.addHeading('PR previews')
              .addRaw('Published after this deployment succeeds. Tests are reported separately.\n')
              .addList(previews.map(p => `https://${context.repo.owner}.github.io/${context.repo.repo}/${p.path}`))
              .write();
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
