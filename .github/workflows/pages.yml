name: Pages and PR previews
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Browser tests]
    branches: [main]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write
  pages: write
  id-token: write
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always load the trusted main branch, never the PR head.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Assemble main page and open PR previews
        id: assemble
        uses: actions/github-script@v7
        with:
          script: |
            const selectTestedMain = require('./.github/scripts/tested-main.cjs');
            const build = require('./.github/scripts/build-pages.cjs');
            const tested = await selectTestedMain({ github, ...context.repo });
            const previews = await build({ github, ...context.repo, output: '_site', mainRef: tested.sha });
            core.setOutput('previews', JSON.stringify(previews));
            const repositoryUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await core.summary.addHeading('Tested main version')
              .addLink(`Commit ${tested.sha}`, `${repositoryUrl}/commit/${tested.sha}`)
              .addRaw('\n\n')
              .addLink('Successful Browser tests run', `${repositoryUrl}/actions/runs/${tested.runId}`)
              .addRaw('\n\nThis exact commit is published when deployment succeeds.\n')
              .addHeading('PR previews')
              .addRaw('Published after this deployment succeeds. Tests are reported separately.\n')
              .addList(previews.map(p => `https://${context.repo.owner}.github.io/${context.repo.repo}/${p.path}`))
              .write();
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Update preview links in pull requests
        uses: actions/github-script@v7
        env:
          PREVIEWS: ${{ steps.assemble.outputs.previews }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const update = require('./.github/scripts/preview-comments.cjs');
            await update({ github, ...context.repo,
              previews: JSON.parse(process.env.PREVIEWS),
              baseUrl: process.env.PAGE_URL });
