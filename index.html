<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein kleines HTML-Labor</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #eef3ff; background: #070b1a; }
    .space-scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .starfield { position: absolute; inset: -40px; background-image: radial-gradient(circle, #d7e5ff 1px, transparent 1.5px), radial-gradient(circle, #a6bcf5 1px, transparent 1.5px); background-size: 83px 97px, 137px 151px; background-position: 0 0, 39px 57px; animation: star-drift 50s ease-in-out infinite alternate; }
    .space-object { position: absolute; left: var(--x); top: var(--y); font-size: clamp(28px, 4vw, 54px); animation: float-orbit var(--duration) ease-in-out infinite alternate; animation-delay: var(--delay); }
    .space-object.crossing { animation-name: cross-orbit; }
    @keyframes star-drift { to { transform: translate(24px, 32px); } }
    @keyframes float-orbit { from { transform: translate(-18px, -24px) rotate(-12deg); } to { transform: translate(28px, 40px) rotate(14deg); } }
    @keyframes cross-orbit { from { transform: translate(-25px, 35px) rotate(-20deg); } to { transform: translate(50px, -45px) rotate(20deg); } }
    @media (prefers-reduced-motion: reduce) {
      .starfield, .space-object, .space-object.crossing { animation: none; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { position: relative; z-index: 1; border: 1px solid #344466; width: min(100%, 540px); background: #121b36; border-radius: 24px; padding: clamp(24px, 6vw, 48px); box-shadow: 0 20px 60px #0008; }
    .label { color: #b8ccff; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-family: 'Comic Sans MS', 'Comic Sans', cursive; color: #c4b5fd; font-size: clamp(28px, 6vw, 40px); margin: 12px 0; }
    @supports (background-clip: text) or (-webkit-background-clip: text) {
      h1 { background-image: linear-gradient(90deg, #c4b5fd, #f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    }
    .smileys { display: flex; gap: 16px; margin-bottom: 20px; }
    .smiley { display: block; width: fit-content; flex-shrink: 0; font-size: 96px; line-height: 1; }
    p { color: #bdcce6; line-height: 1.6; }
    section { margin-top: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input { background: #0b1328; color: inherit; width: 100%; border: 1px solid #687ca3; border-radius: 10px; padding: 12px; font: inherit; }
    input::placeholder { color: #94a6c6; opacity: 1; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #6d46d3; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #29375a; color: #eef3ff; }
    button:hover { filter: brightness(.94); }
    button:disabled { background: #202b46; color: #a5b4ce; cursor: not-allowed; filter: none; }
    :focus-visible { outline: 3px solid #fde68a; outline-offset: 3px; }
    output { display: block; font-size: 48px; font-weight: 700; margin: 8px 0 16px; }
    footer { margin-top: 32px; color: #adc0de; font-size: 13px; }
    @media (max-width: 600px) {
      main { margin-block: 64px; }
      .space-object:nth-child(2), .space-object:nth-child(3) { top: 16px; }
    }
    @media (max-width: 360px) {
      body { padding: 16px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="space-scene" aria-hidden="true">
    <div class="starfield"></div>
    <span class="space-object crossing" style="--x: 7%; --y: 12%; --duration: 17s; --delay: -5s">🚀</span>
    <span class="space-object" style="--x: 83%; --y: 18%; --duration: 29s; --delay: -12s">🪐</span>
    <span class="space-object" style="--x: 5%; --y: 65%; --duration: 23s; --delay: -9s">🌍</span>
    <span class="space-object crossing" style="--x: 87%; --y: 72%; --duration: 19s; --delay: -3s">🛸</span>
    <span class="space-object" style="--x: 18%; --y: 88%; --duration: 13s; --delay: -7s">⭐</span>
    <span class="space-object crossing" style="--x: 74%; --y: 90%; --duration: 31s; --delay: -18s">🌟</span>
  </div>
  <main>
    <div class="smileys">
      <span id="smiley-primary" class="smiley" role="img" aria-label="Erstes Weltall-Symbol">🚀</span>
      <span id="smiley-secondary" class="smiley" role="img" aria-label="Zweites Weltall-Symbol">🌍</span>
    </div>
    <span class="label">HTML · CSS · JavaScript</span>
    <h1>Hier wird experimentiert!</h1>
    <p>Dein kleines Labor für die Zusammenarbeit mit ChatGPT. Klicke, tippe und verändere die App nach Lust und Laune.</p>
    <section>
      <label for="name">Wie heißt du?</label>
      <input id="name" placeholder="Dein Name" maxlength="80" autocomplete="given-name">
      <p id="greeting" aria-live="polite">Hallo! Schön, dass du da bist.</p>
      <button id="welcome" class="secondary" type="button">Neue Willkommensbotschaft</button>
    </section>
    <section aria-labelledby="counter-label">
      <label id="counter-label">Dein Klick-Zähler</label>
      <output id="counter" aria-live="polite">0</output>
      <div class="buttons">
        <button id="increment" type="button">+1 Klick</button>
        <button id="decrement" class="secondary" type="button" disabled>−1 Klick</button>
        <button id="reset" class="secondary" type="button">Zurücksetzen</button>
      </div>
    </section>
    <footer>Keine Anmeldung. Keine Installation. Einfach HTML.</footer>
  </main>
  <script>
    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');
    const counter = document.querySelector('#counter');
    const decrementButton = document.querySelector('#decrement');
    const storageKey = `vibe-counter:${location.pathname.replace(/index\.html$/, '')}`;
    let clicks = readCounter();
    const smileyCycles = [
      { element: document.querySelector('#smiley-primary'), faces: ['🚀', '🪐', '⭐', '🌙', '🛸'], index: 0 },
      { element: document.querySelector('#smiley-secondary'), faces: ['🌍', '☄️', '🌟', '🌌', '👽'], index: 0 },
    ];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let smileyTimers = [];
    let offsetTimer;

    function advanceSmiley(cycle) {
      cycle.index = (cycle.index + 1) % cycle.faces.length;
      cycle.element.textContent = cycle.faces[cycle.index];
    }

    function configureSmileyCycle() {
      smileyTimers.forEach(clearInterval);
      smileyTimers = [];
      clearTimeout(offsetTimer);
      smileyCycles.forEach(cycle => {
        cycle.index = 0;
        cycle.element.textContent = cycle.faces[0];
      });
      if (reducedMotion.matches) return;
      smileyTimers.push(setInterval(() => advanceSmiley(smileyCycles[0]), 3000));
      offsetTimer = setTimeout(() => {
        advanceSmiley(smileyCycles[1]);
        smileyTimers.push(setInterval(() => advanceSmiley(smileyCycles[1]), 3000));
      }, 1500);
    }
    reducedMotion.addEventListener('change', configureSmileyCycle);
    configureSmileyCycle();

    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      greeting.textContent = name ? `Hallo, ${name}! Schön, dass du da bist.` : 'Hallo! Schön, dass du da bist.';
    });
    document.querySelector('#welcome').addEventListener('click', () => {
      const name = nameInput.value.trim();
      const salutation = name ? `Hallo, ${name}!` : 'Hallo!';
      const messages = [
        `${salutation} Willkommen in deinem kleinen HTML-Labor.`,
        `${salutation} Heute ist ein guter Tag zum Experimentieren.`,
        `${salutation} Schön, dass du mit uns Neues ausprobierst.`,
        `${salutation} Viel Spaß beim Klicken und Entdecken!`,
      ];
      const alternatives = messages.filter(message => message !== greeting.textContent);
      greeting.textContent = alternatives[Math.floor(Math.random() * alternatives.length)];
    });
    document.querySelector('#increment').addEventListener('click', () => {
      clicks = Math.min(Number.MAX_SAFE_INTEGER, clicks + 1);
      updateCounter();
    });
    decrementButton.addEventListener('click', () => {
      clicks = Math.max(0, clicks - 1);
      updateCounter();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      clicks = 0;
      updateCounter();
    });
    function updateCounter() {
      counter.textContent = String(clicks);
      decrementButton.disabled = clicks === 0;
      try {
        localStorage.setItem(storageKey, String(clicks));
      } catch {
        // Der Zähler bleibt auch ohne verfügbare Browserspeicherung bedienbar.
      }
    }
    function readCounter() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null || !/^\d+$/.test(saved)) return 0;
        const value = Number(saved);
        return Number.isSafeInteger(value) && value >= 0 ? value : 0;
      } catch {
        return 0;
      }
    }
    updateCounter();
  </script>
</body>
</html>
