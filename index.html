<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein kleines HTML-Labor</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202338; background: #f1f3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 540px); background: white; border-radius: 24px; padding: clamp(24px, 6vw, 48px); box-shadow: 0 20px 60px #20233812; }
    .label { color: #6553ce; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 6vw, 40px); margin: 12px 0; }
    .smiley { display: block; width: fit-content; font-size: 96px; line-height: 1; margin-bottom: 20px; }
    p { color: #60647a; line-height: 1.6; }
    section { margin-top: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #c9ccdb; border-radius: 10px; padding: 12px; font: inherit; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #6553ce; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eeecfb; color: #493a9b; }
    button:hover { filter: brightness(.94); }
    button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    :focus-visible { outline: 3px solid #a391f0; outline-offset: 3px; }
    output { display: block; font-size: 48px; font-weight: 700; margin: 8px 0 16px; }
    footer { margin-top: 32px; color: #72768a; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="smiley" role="img" aria-label="Lächelnder Smiley">🙂</span>
    <span class="label">HTML · CSS · JavaScript</span>
    <h1>Hier wird experimentiert!</h1>
    <p>Dein kleines Labor für die Zusammenarbeit mit ChatGPT. Klicke, tippe und verändere die App nach Lust und Laune.</p>
    <section>
      <label for="name">Wie heißt du?</label>
      <input id="name" placeholder="Dein Name" maxlength="80" autocomplete="given-name">
      <p id="greeting" aria-live="polite">Hallo! Schön, dass du da bist.</p>
      <button id="welcome" class="secondary" type="button">Neue Willkommensbotschaft</button>
    </section>
    <section aria-labelledby="counter-label">
      <label id="counter-label">Dein Klick-Zähler</label>
      <output id="counter" aria-live="polite">0</output>
      <div class="buttons">
        <button id="increment" type="button">+1 Klick</button>
        <button id="decrement" class="secondary" type="button" disabled>−1 Klick</button>
        <button id="reset" class="secondary" type="button">Zurücksetzen</button>
        <button id="color" class="secondary" type="button">Farbe wechseln</button>
      </div>
    </section>
    <footer>Keine Anmeldung. Keine Installation. Einfach HTML.</footer>
  </main>
  <script>
    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');
    const counter = document.querySelector('#counter');
    const decrementButton = document.querySelector('#decrement');
    const storageKey = `vibe-counter:${location.pathname.replace(/index\.html$/, '')}`;
    let clicks = readCounter();
    let colorIndex = 0;
    const colors = ['#f1f3fa', '#e8f5ee', '#fff0df', '#f4eafb'];
    const smiley = document.querySelector('.smiley');
    const smileys = ['🙂', '😄', '😎', '🤩', '😊'];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let smileyIndex = 0;
    let smileyTimer;

    function configureSmileyCycle() {
      clearInterval(smileyTimer);
      if (reducedMotion.matches) {
        smileyIndex = 0;
        smiley.textContent = smileys[0];
        return;
      }
      smileyTimer = setInterval(() => {
        smileyIndex = (smileyIndex + 1) % smileys.length;
        smiley.textContent = smileys[smileyIndex];
      }, 10000);
    }
    reducedMotion.addEventListener('change', configureSmileyCycle);
    configureSmileyCycle();

    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      greeting.textContent = name ? `Hallo, ${name}! Schön, dass du da bist.` : 'Hallo! Schön, dass du da bist.';
    });
    document.querySelector('#welcome').addEventListener('click', () => {
      const name = nameInput.value.trim();
      const salutation = name ? `Hallo, ${name}!` : 'Hallo!';
      const messages = [
        `${salutation} Willkommen in deinem kleinen HTML-Labor.`,
        `${salutation} Heute ist ein guter Tag zum Experimentieren.`,
        `${salutation} Schön, dass du mit uns Neues ausprobierst.`,
        `${salutation} Viel Spaß beim Klicken und Entdecken!`,
      ];
      const alternatives = messages.filter(message => message !== greeting.textContent);
      greeting.textContent = alternatives[Math.floor(Math.random() * alternatives.length)];
    });
    document.querySelector('#increment').addEventListener('click', () => {
      clicks = Math.min(Number.MAX_SAFE_INTEGER, clicks + 1);
      updateCounter();
    });
    decrementButton.addEventListener('click', () => {
      clicks = Math.max(0, clicks - 1);
      updateCounter();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      clicks = 0;
      updateCounter();
    });
    function updateCounter() {
      counter.textContent = String(clicks);
      decrementButton.disabled = clicks === 0;
      try {
        localStorage.setItem(storageKey, String(clicks));
      } catch {
        // Der Zähler bleibt auch ohne verfügbare Browserspeicherung bedienbar.
      }
    }
    function readCounter() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null || !/^\d+$/.test(saved)) return 0;
        const value = Number(saved);
        return Number.isSafeInteger(value) && value >= 0 ? value : 0;
      } catch {
        return 0;
      }
    }
    updateCounter();
    document.querySelector('#color').addEventListener('click', () => {
      colorIndex = (colorIndex + 1) % colors.length;
      document.documentElement.style.backgroundColor = colors[colorIndex];
    });
  </script>
</body>
</html>
