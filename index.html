  <div class="space-scene" aria-hidden="true">

  <script>
    const chaseTrack = document.querySelector('.chase-track');
    const card = document.querySelector('main');
    function placeChaseTrack() {
      const bounds = card.getBoundingClientRect();
      // Keep the chase in the freer screen margin when the mobile card scrolls.
      chaseTrack.classList.toggle('at-bottom', innerHeight - bounds.bottom > bounds.top);
    }
    addEventListener('scroll', placeChaseTrack, { passive: true });
    addEventListener('resize', placeChaseTrack);
    placeChaseTrack();

    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');
    const counter = document.querySelector('#counter');
    const decrementButton = document.querySelector('#decrement');
    const storageKey = `vibe-counter:${location.pathname.replace(/index\.html$/, '')}`;
    let clicks = readCounter();
    const smileyCycles = [
      { element: document.querySelector('#smiley-primary'), faces: ['🚀', '🪐', '⭐', '🌙', '🛸'], index: 0 },
      { element: document.querySelector('#smiley-secondary'), faces: ['🌍', '☄️', '🌟', '🌌', '👽'], index: 0 },
    ];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    // A translating carrier moves each original CSS orbit in viewport coordinates.
    // Subtracting its translation gives the live home position, including resize/scroll.
    const followSettings = { radius: 100, spacing: 64, speed: 900, releaseMs: 80, returnMs: 800 };
    const followers = [...document.querySelectorAll('[data-follow]')].map(element => {
      const carrier = document.createElement('div');
      carrier.className = 'orbit-carrier';
      element.before(carrier);
      carrier.append(element);
      element.dataset.motion = 'orbit';
      return { element, carrier, state: 'orbit', dx: 0, dy: 0, x: 0, y: 0 };
    });
    let collected = [], trail = [], pointer = null, previousMove = null, escapeStart = null;
    let followFrame = null, lastFrame = null;
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    function home(item) {
      const rect = item.element.getBoundingClientRect();
      return { x: rect.x + rect.width / 2 - item.dx, y: rect.y + rect.height / 2 - item.dy };
    }
    function setState(item, state) {
      item.state = state;
      item.element.dataset.motion = state;
    }
    function startFollowFrame() {
      if (followFrame === null && !reducedMotion.matches) {
        lastFrame = null;
        followFrame = requestAnimationFrame(animateFollowers);
      }
    }
    function releaseFollowers() {
      const now = performance.now();
      collected.forEach(item => {
        setState(item, 'returning');
        item.returnStart = now;
        item.returnFrom = { x: item.x, y: item.y };
        delete item.element.dataset.order;
      });
      collected = [];
      escapeStart = null;
      startFollowFrame();
    }
    function resetPointer() {
      pointer = previousMove = escapeStart = null;
      trail = [];
      releaseFollowers();
    }
    function trailPoint(length) {
      for (let i = trail.length - 1; i > 0; i--) {
        const newer = trail[i], older = trail[i - 1], segment = distance(newer, older);
        if (segment >= length && segment > 0) {
          const fraction = length / segment;
          return { x: newer.x + (older.x - newer.x) * fraction, y: newer.y + (older.y - newer.y) * fraction };
        }
        length -= segment;
      }
      const oldest = trail[0], next = trail[1] || { x: oldest.x + 1, y: oldest.y };
      const segment = distance(oldest, next) || 1;
      return { x: oldest.x + (oldest.x - next.x) * length / segment,
        y: oldest.y + (oldest.y - next.y) * length / segment };
    }
    function animateFollowers(now) {
      followFrame = null;
      const elapsed = lastFrame === null ? 16 : Math.min(now - lastFrame, 64);
      lastFrame = now;
      const blend = 1 - Math.exp(-elapsed / 90);
      const targets = new Map();
      let tailLength = 0;
      const occupied = [pointer];
      collected.forEach(item => {
        tailLength += followSettings.spacing;
        let target = trailPoint(tailLength);
        // On tight turns, leave enough visual space as well as distance along the trail.
        while (occupied.some(point => distance(target, point) < followSettings.spacing - 0.01) && tailLength < 4096) {
          tailLength += 4;
          target = trailPoint(tailLength);
        }
        targets.set(item, target);
        occupied.push(target);
      });
      followers.forEach(item => {
        if (item.state === 'orbit') return;
        const origin = home(item);
        if (item.state === 'following') {
          const target = targets.get(item);
          item.x += (target.x - item.x) * blend;
          item.y += (target.y - item.y) * blend;
        } else {
          const progress = Math.min(1, (now - item.returnStart) / followSettings.returnMs);
          const eased = progress * progress * (3 - 2 * progress);
          item.x = item.returnFrom.x + (origin.x - item.returnFrom.x) * eased;
          item.y = item.returnFrom.y + (origin.y - item.returnFrom.y) * eased;
          if (progress === 1) setState(item, 'orbit');
        }
        item.dx = item.state === 'orbit' ? 0 : item.x - origin.x;
        item.dy = item.state === 'orbit' ? 0 : item.y - origin.y;
        item.carrier.style.transform = `translate(${item.dx}px, ${item.dy}px)`;
      });
      if (followers.some(item => item.state !== 'orbit')) {
        followFrame = requestAnimationFrame(animateFollowers);
      } else lastFrame = null;
    }
    function moveFollowers(event) {
      if (event.pointerType !== 'mouse' || reducedMotion.matches) return;
      const now = performance.now(), next = { x: event.clientX, y: event.clientY };
      if (!pointer) {
        // Seed a straight tail, so even a stationary first capture has spaced targets.
        trail = [{ x: next.x - followSettings.spacing * (followers.length + 1), y: next.y }, next];
      } else if (distance(pointer, next) > 0) trail.push(next);
      pointer = next;
      // Keep only the length needed by the four followers, with a small margin.
      let length = 0;
      for (let i = trail.length - 1; i > 0; i--) {
        length += distance(trail[i], trail[i - 1]);
        if (length > followSettings.spacing * (followers.length + 2)) {
          trail.splice(0, i - 1);
          break;
        }
      }
      const first = collected[0];
      if (first && previousMove) {
        const elapsed = now - previousMove.time;
        const speed = elapsed > 0 ? distance(next, previousMove) * 1000 / elapsed : 0;
        const away = distance(next, first) > distance(previousMove, first) + 0.1;
        if (elapsed > 0 && elapsed <= followSettings.releaseMs && speed >= followSettings.speed && away) {
          escapeStart ??= previousMove.time;
          if (now - escapeStart >= followSettings.releaseMs) releaseFollowers();
        } else escapeStart = null;
      } else escapeStart = null;
      // DOM order supplies a deterministic tie-breaker for simultaneous captures.
      followers.forEach(item => {
        if (item.state !== 'orbit') return;
        const origin = home(item);
        if (distance(next, origin) <= followSettings.radius) {
          item.x = origin.x;
          item.y = origin.y;
          setState(item, 'following');
          item.element.dataset.order = collected.length;
          collected.push(item);
        }
      });
      previousMove = { ...next, time: now };
      startFollowFrame();
    }
    addEventListener('pointermove', moveFollowers, { passive: true });
    document.documentElement.addEventListener('pointerleave', event => {
      if (event.pointerType === 'mouse') resetPointer();
    });
    addEventListener('blur', resetPointer);
    document.addEventListener('visibilitychange', () => { if (document.hidden) resetPointer(); });
    // A changed viewport invalidates the old mouse trail; return to live orbit points.
    addEventListener('resize', resetPointer);
    addEventListener('scroll', resetPointer, { passive: true });
    reducedMotion.addEventListener('change', () => {
      if (followFrame !== null) cancelAnimationFrame(followFrame);
      followFrame = lastFrame = null;
      collected = []; trail = []; pointer = previousMove = escapeStart = null;
      followers.forEach(item => {
        setState(item, 'orbit');
        item.dx = item.dy = 0;
        item.carrier.style.transform = '';
        delete item.element.dataset.order;
      });
    });

    let smileyTimers = [];
    let offsetTimer;

    function advanceSmiley(cycle) {
      cycle.index = (cycle.index + 1) % cycle.faces.length;
      cycle.element.textContent = cycle.faces[cycle.index];
    }

    function configureSmileyCycle() {
      smileyTimers.forEach(clearInterval);
      smileyTimers = [];
      clearTimeout(offsetTimer);
      smileyCycles.forEach(cycle => {
        cycle.index = 0;
        cycle.element.textContent = cycle.faces[0];
      });
      if (reducedMotion.matches) return;
      smileyTimers.push(setInterval(() => advanceSmiley(smileyCycles[0]), 3000));
      offsetTimer = setTimeout(() => {
        advanceSmiley(smileyCycles[1]);
        smileyTimers.push(setInterval(() => advanceSmiley(smileyCycles[1]), 3000));
      }, 1500);
    }
    reducedMotion.addEventListener('change', configureSmileyCycle);
    configureSmileyCycle();

    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      greeting.textContent = name ? `Hallo, ${name}! Schön, dass du da bist.` : 'Hallo! Schön, dass du da bist.';
    });
    document.querySelector('#welcome').addEventListener('click', () => {
      const name = nameInput.value.trim();
      const salutation = name ? `Hallo, ${name}!` : 'Hallo!';
      const messages = [
        `${salutation} Willkommen in deinem kleinen HTML-Labor.`,
        `${salutation} Heute ist ein guter Tag zum Experimentieren.`,
        `${salutation} Schön, dass du mit uns Neues ausprobierst.`,
        `${salutation} Viel Spaß beim Klicken und Entdecken!`,
      ];
      const alternatives = messages.filter(message => message !== greeting.textContent);
      greeting.textContent = alternatives[Math.floor(Math.random() * alternatives.length)];
    });
    document.querySelector('#increment').addEventListener('click', () => {
      clicks = Math.min(Number.MAX_SAFE_INTEGER, clicks + 1);
      updateCounter();
    });
    decrementButton.addEventListener('click', () => {
      clicks = Math.max(0, clicks - 1);
      updateCounter();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      clicks = 0;
      updateCounter();
    });
    function updateCounter() {
      counter.textContent = String(clicks);
      decrementButton.disabled = clicks === 0;
      try {
        localStorage.setItem(storageKey, String(clicks));
      } catch {
        // Der Zähler bleibt auch ohne verfügbare Browserspeicherung bedienbar.
      }
    }
    function readCounter() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null || !/^\d+$/.test(saved)) return 0;
        const value = Number(saved);
        return Number.isSafeInteger(value) && value >= 0 ? value : 0;
      } catch {
        return 0;
      }
    }
    updateCounter();
  </script>
</body>
</html>
